{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
    <h2>Delete {{ type }}?</h2>
    <p>Are you sure you want to permanently delete <strong>{{ object }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="javascript:history.back()" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
